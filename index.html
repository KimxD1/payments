<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>열매 ㄱㄴㄷ 뷔페</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    /* 따뜻하고 밝은 노란색 파스텔 계열 컬러 팔레트 */
    --bg-page: #FFF4C3;        /* 따뜻한 파스텔 노랑 배경 */
    --bg-card: #FFFFFF;        /* 카드 및 컨테이너 (깔끔한 흰색) */
    --primary: #FFD23F;        /* 메인 노랑-주황 버튼 */
    --primary-press: #E6B800;
    --secondary: #FFE082;      /* 연한 따뜻한 노랑 */
    --secondary-press: #F5C842;
    --accent: #FF7B54;         /* 포인트 상큼한 주황 */
    --accent-press: #E25B34;
    --text-dark: #4A3E3D;      /* 부드러운 다크 브라운 */
    --text-mid: #8C7A6B;       /* 따뜻한 토프 브라운 */
    --border-color: #F0CF65;   /* 귀여운 테두리 색상 */
    --radius: 24px;
    --shadow: 0 8px 20px rgba(212, 160, 23, 0.15);
    --btn-shadow: 0 6px 0px #DDA800;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;
    width:100%;
    height:100%;
    overscroll-behavior:none;
  }
  body{
    background: var(--bg-page);
    font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
    display:flex;
    align-items:stretch;
    justify-content:center;
    min-height:100dvh;
    color: var(--text-dark);
  }

  /* 태블릿 대응 앱 컨테이너 */
  .app{
    position:relative;
    width:100%;
    max-width:820px;
    min-height:100dvh;
    background: var(--bg-page);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .screen{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    padding: clamp(20px, 4vh, 40px) clamp(20px, 5vw, 48px);
    animation: fadeIn .3s ease-out;
  }
  .screen.active{display:flex;}
  @keyframes fadeIn{from{opacity:0; transform: scale(0.98);} to{opacity:1; transform: scale(1);}}

  h1,h2,.headline{
    font-family:'Jua',sans-serif;
    color:var(--text-dark);
    margin:0;
    line-height:1.35;
  }

  /* ---- 상단 바 ---- */
  .status-bar{
    display:flex;
    gap:clamp(12px, 2vw, 18px);
    margin-bottom:clamp(16px, 2.5vh, 24px);
  }
  .status-chip{
    flex:1;
    background:var(--bg-card);
    border-radius:var(--radius);
    padding:clamp(14px, 2vh, 20px) clamp(12px, 2vw, 18px);
    text-align:center;
    border: 3px solid var(--border-color);
    box-shadow: var(--shadow);
  }
  .status-chip .label{font-size:clamp(14px, 1.8vh, 18px); color:var(--text-mid); font-weight: bold;}
  .status-chip .value{font-family:'Jua',sans-serif; font-size:clamp(22px, 3.5vh, 30px); color:var(--accent); margin-top:2px;}

  .back-btn{
    position:absolute;
    top:clamp(16px, 3vh, 24px); left:clamp(16px, 4vw, 24px);
    width:clamp(52px, 8vh, 64px); height:clamp(52px, 8vh, 64px);
    border-radius:50%;
    background:var(--bg-card);
    border: 3px solid var(--border-color);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:clamp(24px, 3.5vh, 32px);
    line-height:1;
    color:var(--text-dark);
    display:flex; align-items:center; justify-content:center;
    padding:2px 0 0 2px;
    z-index:5;
    cursor:pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    transition: transform .1s ease, background .15s ease;
    touch-action:manipulation;
  }
  .back-btn:active{transform:scale(0.9); background:var(--secondary);}

  /* ---- 유아 친화적인 입체 버튼 스타일 ---- */
  .box-btn{
    border: 3px solid #DDA800;
    border-radius:var(--radius);
    font-family:'Jua',sans-serif;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    color:var(--text-dark);
    box-shadow: var(--btn-shadow);
    transition: transform .08s ease, box-shadow .08s ease, background-color .12s ease;
    min-height:clamp(72px, 10vh, 96px);
    touch-action:manipulation;
    user-select:none;
  }
  .box-btn:active{
    transform: translateY(4px);
    box-shadow: 0 2px 0px #DDA800;
  }
  .box-btn.primary{background:var(--primary);}
  .box-btn.secondary{background:var(--secondary); border-color: #E2B022; box-shadow: 0 6px 0px #E2B022;}
  .box-btn.secondary:active{box-shadow: 0 2px 0px #E2B022;}
  .box-btn.accent{background:var(--accent); border-color: #D94625; color: #FFF; box-shadow: 0 6px 0px #D94625;}
  .box-btn.accent:active{box-shadow: 0 2px 0px #D94625;}
  .box-btn.dark{background:var(--text-dark); border-color: #2D2524; color: #FFF; box-shadow: 0 6px 0px #2D2524;}
  .box-btn.dark:active{box-shadow: 0 2px 0px #2D2524;}
  .box-btn:disabled{
    background:#E6DFCE;
    border-color: #C5BDAB;
    color:#AA9F8C;
    box-shadow: 0 6px 0px #C5BDAB;
    cursor:not-allowed;
  }
  .box-btn:disabled:active{transform:none; box-shadow: 0 6px 0px #C5BDAB;}

  /* ---------------- 화면 1. 시작 화면 ---------------- */
  #screen-start{
    align-items:center;
    justify-content:space-around;
    text-align:center;
    padding: clamp(30px, 5vh, 60px) clamp(20px, 5vw, 40px);
  }
  
  /* 올려주신 손글씨 간판 이미지 프레임 */
  .signboard-wrap {
    width: 100%;
    max-width: 680px;
    background: #FFF;
    padding: 16px;
    border-radius: 32px;
    border: 5px solid #F0CF65;
    box-shadow: 0 12px 28px rgba(212, 160, 23, 0.22);
    transform: rotate(-1deg);
    transition: transform 0.3s ease;
  }
  .signboard-wrap:hover {
    transform: rotate(0deg) scale(1.02);
  }
  .signboard-img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 20px;
    object-fit: contain;
  }

  .start-welcome-badge {
    display: inline-block;
    background: #FF7B54;
    color: #FFF;
    font-family: 'Jua', sans-serif;
    font-size: clamp(20px, 3.5vh, 28px);
    padding: 8px 24px;
    border-radius: 50px;
    margin-bottom: 12px;
    box-shadow: 0 4px 10px rgba(255, 123, 84, 0.3);
    animation: bounce 2s infinite ease-in-out;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .start-cta{
    width:100%;
    max-width: 500px;
    font-size:clamp(26px, 4.5vh, 36px);
    padding: 0 20px;
  }

  /* ---------------- 화면 2. 인원 선택 ---------------- */
  #screen-count{justify-content:flex-start;}
  .count-title{font-size:clamp(24px, 4vh, 34px); text-align:center; margin-top:clamp(44px, 7vh, 64px);}
  .counter{
    margin:clamp(24px, 4vh, 40px) 0 clamp(20px, 3vh, 28px);
    display:flex;
    align-items:stretch;
    gap:clamp(12px, 2vw, 20px);
  }
  .counter-btn{
    width:clamp(76px, 14vw, 110px);
    font-size:clamp(36px, 6vh, 56px);
    background:var(--secondary);
  }
  .counter-display{
    flex:1;
    background:var(--bg-card);
    border-radius:var(--radius);
    border: 3px solid var(--border-color);
    box-shadow: var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Jua',sans-serif;
    font-size:clamp(34px, 6vh, 52px);
    color:var(--text-dark);
  }
  .price-box{
    background:var(--bg-card);
    border-radius:var(--radius);
    border: 3px solid var(--border-color);
    box-shadow: var(--shadow);
    padding:clamp(16px, 2.5vh, 24px) clamp(16px, 3vw, 24px);
    text-align:center;
    margin-bottom:12px;
  }
  .price-box .label{font-size:clamp(15px, 2vh, 19px); color:var(--text-mid); font-weight: bold;}
  .price-box .amount{font-family:'Jua',sans-serif; font-size:clamp(32px, 6vh, 48px); color:var(--accent); margin-top:4px;}
  .unit-price{font-size:clamp(14px, 2vh, 18px); color:var(--text-mid); text-align:center; margin-bottom:auto;}
  #screen-count .box-btn.primary{font-size:clamp(22px, 3.8vh, 30px); margin-top:16px;}

  /* ---------------- 화면 3. 결제 방법 선택 ---------------- */
  #screen-confirm{justify-content:flex-start;}
  .confirm-title{font-size:clamp(22px, 3.8vh, 30px); text-align:center; margin:clamp(16px, 3vh, 28px) 0 clamp(16px, 3vh, 24px);}
  .method-btn{
    width:100%;
    font-size:clamp(22px, 3.8vh, 30px);
    margin-bottom:clamp(16px, 2.5vh, 22px);
    padding:0 20px;
  }
  .method-icon{font-size:clamp(28px, 5vh, 40px);}

  /* ---------------- 화면 4-A. 카드 결제 / 4-B. 현금 결제 공통 ---------------- */
  .center-screen{align-items:center; justify-content:center; text-align:center; gap:clamp(16px, 3vh, 24px);}
  .pay-card-box {
    background: #FFF;
    width: 100%;
    border-radius: 32px;
    padding: clamp(24px, 4vh, 40px);
    border: 4px solid var(--border-color);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .pay-title{font-size:clamp(24px, 4vh, 32px);}
  .pay-desc{font-size:clamp(18px, 3vh, 24px); color:var(--text-mid); line-height:1.5; font-weight: bold;}
  .pay-amount{font-family:'Jua',sans-serif; font-size:clamp(36px, 7vh, 52px); color:var(--accent);}
  .tag-icon{font-size:clamp(64px, 12vh, 96px);}
  .sim-btn{width:100%; max-width: 400px; font-size:clamp(20px, 3.5vh, 26px);}
  .pulse{animation:pulse 1.4s infinite ease-in-out;}
  @keyframes pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.1);}}

  /* ---------------- 화면 4-B. 서명 ---------------- */
  #screen-signature{justify-content:flex-start;}
  .sig-title{font-size:clamp(22px, 3.8vh, 30px); text-align:center; margin:clamp(16px, 3vh, 26px) 0 clamp(12px, 2vh, 18px);}
  .sig-pad-wrap{
    flex:1;
    background:var(--bg-card);
    border-radius:var(--radius);
    border: 4px dashed var(--accent);
    overflow:hidden;
    margin-bottom:clamp(14px, 2.5vh, 20px);
    position:relative;
    min-height:200px;
    box-shadow: var(--shadow);
  }
  #sigCanvas{width:100%; height:100%; display:block; touch-action:none;}
  .sig-hint{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-mid); font-size:clamp(16px, 2.5vh, 20px); font-weight: bold;
    pointer-events:none;
  }
  .sig-actions{display:flex; gap:clamp(12px, 2vw, 18px);}
  .sig-actions .box-btn{flex:1; font-size:clamp(20px, 3.5vh, 26px);}

  /* ---------------- 화면 6. 결제 완료 ---------------- */
  .complete-icon{font-size:clamp(60px, 11vh, 100px);}
  .complete-title{font-size:clamp(24px, 4.2vh, 34px);}
  .complete-sub{font-size:clamp(18px, 3vh, 24px); color:var(--text-mid); font-weight: bold;}
  .complete-info{
    display:flex; gap:clamp(12px, 2vw, 18px); width:100%;
    margin-top:8px;
  }

  .grow{flex:1;}

  /* 랜드스케이프 태블릿 보정 */
  @media (orientation: landscape) and (max-height: 620px){
    .tag-icon{font-size:clamp(48px, 9vh, 72px);}
    .complete-icon{font-size:clamp(48px, 9vh, 72px);}
    .signboard-wrap{padding: 10px;}
  }
</style>
</head>
<body>

<div class="app">

  <!-- ================= 화면 1. 시작 화면 ================= -->
  <div class="screen active" id="screen-start">
    <div class="start-welcome-badge">맛있는 과일이 가득! 🍓🍇</div>
    
    <!-- 아이들이 직접 그린 'IMG_5542.jpg' 간판 사진 배치 -->
    <div class="signboard-wrap">
      <img src="IMG_5542.jpeg" alt="열매 ㄱㄴㄷ 뷔페" class="signboard-img">
    </div>

    <button class="box-btn primary start-cta" onclick="goTo('screen-count')">시작하기 ➔</button>
  </div>

  <!-- ================= 화면 2. 인원 선택 ================= -->
  <div class="screen" id="screen-count">
    <button class="back-btn" onclick="goTo('screen-start')">‹</button>
    <h2 class="count-title">몇 명이 이용하시나요?</h2>

    <div class="counter">
      <button class="box-btn counter-btn" onclick="changeCount(-1)">−</button>
      <div class="counter-display" id="countDisplay">0명</div>
      <button class="box-btn counter-btn" onclick="changeCount(1)">＋</button>
    </div>

    <div class="price-box">
      <div class="label">결제 금액</div>
      <div class="amount" id="priceDisplay">0원</div>
    </div>
    <div class="unit-price">1인 당 10,000원</div>

    <button class="box-btn primary" id="nextBtn" onclick="goTo('screen-confirm')" disabled>다음 단계로 ➔</button>
  </div>

  <!-- ================= 화면 3. 결제 방법 선택 ================= -->
  <div class="screen" id="screen-confirm">
    <button class="back-btn" onclick="goTo('screen-count')">‹</button>
    <div class="status-bar" style="margin-top:clamp(48px, 9vh, 72px);">
      <div class="status-chip">
        <div class="label">이용 인원</div>
        <div class="value" id="confirmCount">0명</div>
      </div>
      <div class="status-chip">
        <div class="label">총 결제 금액</div>
        <div class="value" id="confirmPrice">0원</div>
      </div>
    </div>
    <h2 class="confirm-title">어떻게 결제할까요?</h2>
    <button class="box-btn primary method-btn" onclick="startCard()">
      <span class="method-icon">💳</span> 카드 결제
    </button>
    <button class="box-btn secondary method-btn" onclick="goTo('screen-cash')">
      <span class="method-icon">💵</span> 현금 결제
    </button>
  </div>

  <!-- ================= 화면 4-A. 카드 결제 ================= -->
  <div class="screen center-screen" id="screen-card">
    <button class="back-btn" onclick="leaveCardScreen()">‹</button>
    <div class="pay-card-box">
      <h2 class="pay-title">카드 결제</h2>
      <div class="tag-icon pulse" id="cardTagIcon">💳</div>
      <div class="pay-desc" id="cardPayDesc">카드를 결제기에<br>콕! 태그해주세요</div>
      <div class="pay-amount" id="cardAmount">0원</div>
    </div>
  </div>

  <!-- ================= 화면 4-B. 서명 ================= -->
  <div class="screen" id="screen-signature">
    <h2 class="sig-title">멋지게 서명해주세요! ✍️</h2>
    <div class="sig-pad-wrap">
      <canvas id="sigCanvas"></canvas>
      <div class="sig-hint" id="sigHint">여기에 손가락으로 이름을 써보세요</div>
    </div>
    <div class="sig-actions">
      <button class="box-btn secondary" onclick="clearSignature()">다시 쓰기</button>
      <button class="box-btn primary" onclick="finishPayment()">완료!</button>
    </div>
  </div>

  <!-- ================= 화면 5. 현금 결제 ================= -->
  <div class="screen center-screen" id="screen-cash">
    <button class="back-btn" onclick="goTo('screen-confirm')">‹</button>
    <div class="pay-card-box">
      <h2 class="pay-title">현금 결제</h2>
      <div class="tag-icon">💵</div>
      <div class="pay-amount" id="cashAmount">0원</div>
      <div class="pay-desc">직원에게 현금을<br>전달해주세요</div>
      <button class="box-btn dark sim-btn" onclick="finishPayment()">결제 완료</button>
    </div>
  </div>

  <!-- ================= 화면 6. 결제 완료 ================= -->
  <div class="screen center-screen" id="screen-complete">
    <div class="pay-card-box">
      <div class="complete-icon">🎉</div>
      <h2 class="complete-title">결제가 완료되었습니다!</h2>
      <div class="complete-sub">맛있게 드세요! 🍎🍌🍊</div>
      <div class="complete-info">
        <div class="status-chip grow">
          <div class="label">이용 인원</div>
          <div class="value" id="doneCount">0명</div>
        </div>
        <div class="status-chip grow">
          <div class="label">결제 금액</div>
          <div class="value" id="donePrice">0원</div>
        </div>
      </div>
      <button class="box-btn primary" style="width:100%; margin-top: 10px;" onclick="resetAll()">처음으로 돌아가기</button>
    </div>
  </div>

</div>

<script>
  const UNIT_PRICE = 10000;
  let state = { count: 0 };

  function fmt(n){ return n.toLocaleString('ko-KR') + '원'; }

  function goTo(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function changeCount(delta){
    state.count = Math.max(0, state.count + delta);
    updateCountUI();
  }

  function updateCountUI(){
    const total = state.count * UNIT_PRICE;
    document.getElementById('countDisplay').textContent = state.count + '명';
    document.getElementById('priceDisplay').textContent = fmt(total);
    document.getElementById('nextBtn').disabled = state.count === 0;
  }

  function syncStatusEverywhere(){
    const total = state.count * UNIT_PRICE;
    document.getElementById('confirmCount').textContent = state.count + '명';
    document.getElementById('confirmPrice').textContent = fmt(total);
    document.getElementById('cardAmount').textContent = fmt(total);
    document.getElementById('cashAmount').textContent = fmt(total);
    document.getElementById('doneCount').textContent = state.count + '명';
    document.getElementById('donePrice').textContent = fmt(total);
  }

  function startCard(){
    syncStatusEverywhere();
    goTo('screen-card');
    startNfcScan();
  }

  /* ---- 실제 NFC 카드 태그 감지 (Web NFC API) ---- */
  let nfcAbortController = null;
  let tagProcessed = false;

  function resetCardScreenMessage(){
    const desc = document.getElementById('cardPayDesc');
    const icon = document.getElementById('cardTagIcon');
    if(desc) desc.innerHTML = '카드를 결제기에<br>콕! 태그해주세요';
    if(icon) icon.classList.add('pulse');
  }

  function startNfcScan(){
    tagProcessed = false;
    resetCardScreenMessage();

    if(!('NDEFReader' in window)){
      document.getElementById('cardPayDesc').innerHTML = '이 기기에서는 NFC 인식이<br>지원되지 않아요. 직원을 불러주세요';
      document.getElementById('cardTagIcon').classList.remove('pulse');
      return;
    }

    nfcAbortController = new AbortController();
    const reader = new NDEFReader();

    reader.scan({ signal: nfcAbortController.signal }).then(() => {
      reader.onreading = () => {
        if(tagProcessed) return;
        tagProcessed = true;
        cardTagged();
      };
      reader.onreadingerror = () => {};
    }).catch(() => {
      document.getElementById('cardPayDesc').innerHTML = 'NFC 권한이 필요해요<br>직원을 불러주세요';
      document.getElementById('cardTagIcon').classList.remove('pulse');
    });
  }

  function stopNfcScan(){
    if(nfcAbortController){
      nfcAbortController.abort();
      nfcAbortController = null;
    }
  }

  function leaveCardScreen(){
    stopNfcScan();
    goTo('screen-confirm');
  }

  const _goTo = goTo;
  goTo = function(id){
    if(id === 'screen-confirm' || id === 'screen-cash'){ syncStatusEverywhere(); }
    _goTo(id);
  };

  function cardTagged(){
    stopNfcScan();
    goTo('screen-signature');
    requestAnimationFrame(() => requestAnimationFrame(setupSignaturePad));
  }

  function finishPayment(){
    syncStatusEverywhere();
    goTo('screen-complete');
  }

  function resetAll(){
    state.count = 0;
    updateCountUI();
    goTo('screen-start');
  }

  updateCountUI();

  /* ---- 서명 패드 (태블릿 터치 대응) ---- */
  let sigCtx = null;
  let sigCanvas = null;
  let drawing = false;
  let hasStroke = false;
  let activePointerId = null;

  function setupSignaturePad(){
    sigCanvas = document.getElementById('sigCanvas');
    const rect = sigCanvas.getBoundingClientRect();

    if(rect.width === 0 || rect.height === 0){
      requestAnimationFrame(setupSignaturePad);
      return;
    }

    const dpr = window.devicePixelRatio || 1;
    sigCanvas.width = Math.round(rect.width * dpr);
    sigCanvas.height = Math.round(rect.height * dpr);

    sigCtx = sigCanvas.getContext('2d');
    sigCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sigCtx.lineWidth = 4;
    sigCtx.lineCap = 'round';
    sigCtx.lineJoin = 'round';
    sigCtx.strokeStyle = '#4A3E3D';

    hasStroke = false;
    document.getElementById('sigHint').style.display = 'flex';

    sigCanvas.onpointerdown = handlePointerDown;
    sigCanvas.onpointermove = handlePointerMove;
    sigCanvas.onpointerup = handlePointerEnd;
    sigCanvas.onpointercancel = handlePointerEnd;
    sigCanvas.onpointerleave = handlePointerEnd;
  }

  function getPos(e){
    const rect = sigCanvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function handlePointerDown(e){
    e.preventDefault();
    drawing = true;
    activePointerId = e.pointerId;
    try{ sigCanvas.setPointerCapture(e.pointerId); }catch(err){}
    if(!hasStroke){
      hasStroke = true;
      document.getElementById('sigHint').style.display = 'none';
    }
    const p = getPos(e);
    sigCtx.beginPath();
    sigCtx.moveTo(p.x, p.y);
  }

  function handlePointerMove(e){
    if(!drawing || e.pointerId !== activePointerId) return;
    e.preventDefault();
    const p = getPos(e);
    sigCtx.lineTo(p.x, p.y);
    sigCtx.stroke();
  }

  function handlePointerEnd(e){
    if(e.pointerId !== activePointerId) return;
    drawing = false;
    activePointerId = null;
  }

  function clearSignature(){
    if(!sigCtx || !sigCanvas) return;
    sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
    hasStroke = false;
    document.getElementById('sigHint').style.display = 'flex';
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const sigScreen = document.getElementById('screen-signature');
      if(sigScreen.classList.contains('active')){
        setupSignaturePad();
      }
    }, 150);
  });
</script>

</body>
</html>
